name: Arch Linux
on:
  push:
    branches-ignore: [codex/arch-test-report]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install signed Arch packages
        run: pacman -Syu --noconfirm --needed git base-devel rust gtk3 webkit2gtk-4.1 libayatana-appindicator xdotool python sway dbus
      - uses: actions/checkout@v4
      - name: Prepare unprivileged test user
        run: |
          useradd -m tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Build and check
        shell: bash
        run: |
          set +e
          runuser -u tester -- bash scripts/check_arch.sh > arch-test.log 2>&1
          result=$?
          tail -100 arch-test.log
          { echo '### Arch check output'; echo '```text'; tail -100 arch-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Publish test report
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          if [[ -f arch-test.log ]]; then
            mkdir -p docs/testing
            tail -150 arch-test.log > docs/testing/arch-last-run.log
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/testing/arch-last-run.log
            git commit -m "Record Arch test output for $GITHUB_SHA"
            git push origin HEAD:refs/heads/codex/arch-test-report --force-with-lease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: craftpulse-arch-x86_64
          path: target/release/craftpulse
