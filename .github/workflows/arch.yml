name: Arch Linux
on: [push, pull_request, workflow_dispatch]
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install signed Arch packages
        run: pacman -Syu --noconfirm --needed git base-devel rust gtk3 webkit2gtk-4.1 libayatana-appindicator xdotool python sway dbus
      - uses: actions/checkout@v4
      - name: Prepare unprivileged test user
        run: |
          useradd -m tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Build and check
        run: runuser -u tester -- bash scripts/check_arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftpulse-arch-x86_64
          path: target/release/craftpulse
